spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        order_inserts: false
jwt:
  secret: ${JWT_SECRET:TEST-ONLY-DO-NOT-USE-IN-PROD-1234567890123456789012}
  exp-minutes: 5