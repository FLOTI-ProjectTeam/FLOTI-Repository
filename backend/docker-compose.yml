version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mvp-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mvp-network

  redis:
    image: redis:7
    ports:
      - "6379:6379"
  app:
    build: .
    container_name: floti-app
    environment:
      - JWT_SECRET_BASE64=${JWT_SECRET_BASE64}
    depends_on:
      - db
      - redis
    ports:
      - "8080:8080"
    networks:
      - mvp-network

networks:
  mvp-network:
    driver: bridge